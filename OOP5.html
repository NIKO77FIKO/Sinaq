<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Sınaq Sistemi</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --btn-red: #e74c3c;
            --btn-green: #2ecc71;
            --border-color: #e1e8ed;
            --badge-bg: #e8f4fd;
            --progress-bg: #e1e8ed;
        }
        .dark-mode {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --primary-color: #357abd;
            --border-color: #444444;
            --badge-bg: #3a3a3a;
            --progress-bg: #444444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .quiz-container {
            max-width: 750px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1, h2 { text-align: center; color: var(--text-color); margin: 5px 0; }
        .author { text-align: center; font-weight: bold; margin-bottom: 20px; }
        
        /* Top Control Panel */
        .top-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: stretch;
        }
        .timer-box {
            background-color: var(--btn-red);
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-width: 140px;
        }
        .stats-box {
            background-color: #e2e8f0;
            color: #333;
            padding: 12px 15px;
            border-radius: 6px;
            flex-grow: 1;
            font-size: 13px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .dark-mode .stats-box { background-color: #444; color: white; }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: var(--progress-bg);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--btn-green);
            transition: width 0.3s ease;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-blue { background-color: #4a90e2; }
        .btn-red { background-color: var(--btn-red); }
        .btn-green { background-color: var(--btn-green); }

        /* Questions */
        .question-card {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        /* Final Classes */
        .card-correct { background-color: rgba(46, 204, 113, 0.15) !important; border-color: var(--btn-green) !important; }
        .card-incorrect { background-color: rgba(231, 76, 60, 0.15) !important; border-color: var(--btn-red) !important; }
        .card-blank { background-color: rgba(241, 196, 15, 0.15) !important; border-color: #f1c40f !important; }

        .question-text { font-size: 15px; font-weight: bold; margin-bottom: 15px; }
        .q-badge { background-color: var(--badge-bg); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        pre { background: #23272e; color: #abb2bf; padding: 12px; border-radius: 6px; overflow-x: auto; }
        
        .options-container { display: flex; flex-direction: column; gap: 8px; }
        .option-label {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .option-label:hover { background-color: rgba(74, 144, 226, 0.1); }
        
        .opt-correct { background-color: rgba(46, 204, 113, 0.25) !important; font-weight: bold; border-color: var(--btn-green) !important; }
        .opt-incorrect { background-color: rgba(231, 76, 60, 0.25) !important; font-weight: bold; border-color: var(--btn-red) !important; }

        .result-detail {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 13px;
            font-weight: bold;
        }

        /* Final Score Section */
        .final-result-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
        }
        .result-grid {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Online Sınaq İmtahanı</h1>
    <div class="author">By Nurali and Nihat</div>

    <div class="top-panel">
        <div id="timer" class="timer-box">Qalan vaxt: 30:00</div>
        <div class="stats-box">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="live-stats">
                Cavablanan: 0 / 25<br>Düz: 0 · Səhv: 0 · Boş: 25
            </div>
        </div>
    </div>

    <button class="btn-action btn-blue" onclick="toggleDarkMode()">🌙 Dark / Light</button>
    <button class="btn-action btn-blue" onclick="restartQuiz()">25 sualı yenidən seç (random)</button>
    <button class="btn-action btn-red" onclick="resetAnswers()">Cavabları sıfırla</button>

    <div id="quiz"></div>

    <button id="finish-btn" class="btn-action btn-green" style="padding:15px; font-size:16px;" onclick="finishExam()">İmtahanı Bitir</button>

    <div id="final-score-box" class="final-result-section" style="display:none;">
        <h2>Nəticə</h2><br>
        <div class="result-grid">
            <span id="res-duz">Düz: 0 (x2)</span>
            <span id="res-sehv">Səhv: 0 (x-1)</span>
            <span id="res-bos">Boş: 25</span>
        </div>
        <div style="font-size:15px; line-height: 1.8;">
            <b>Sınaq balı:</b> <span id="sc-sinag">0</span><br>
            <b>Giriş balı:</b> <span id="sc-giris">0</span><br>
            <hr style="border:0; border-top:1px solid var(--border-color);">
            <b style="font-size:18px; color:var(--primary-color);">Yekun bal: <span id="sc-yekun">0</span></b>
        </div>
        <button class="btn-action btn-green" style="margin-top:20px;" onclick="restartQuiz()">Yenidən başla</button>
    </div>
</div>

<script>
// Sual bazası
const allQuestions = [
    { id: 96, q: "id-si “demo” olan bir elementi(tag), CSS3-də necə təyin edə bilərsiniz?", c: ["*demo", "demo", "#demo", ".demo"], a: 2 },
    { id: 157, q: "CSS-də mətnin bütün hərflərini böyük hərfə çevirən əmri seçin.", c: ["font-variant", "text-decoration", "text-style", "text-transform: uppercase;"], a: 3 },
    { id: 98, q: "Mövqe (position) xüsusiyyətinin standart sabit dəyəri nədir (CSS3)?", c: ["relative", "static", "absolute", "fixed"], a: 1 },
    { id: 92, q: "Mətndəki hər bir sözün böyük hərflə başlaması üçün CSS3-sintaksisi.", c: ["text-case: capital;", "text-transform: capitalize;", "font-transform: upper;", "text-style: capitalize;"], a: 1 },
    { id: 27, q: "HTML5-də boş giriş sahəsinə “text” xanalarına hansı əmr verildikdə, o xana mütləq doldurulmalıdır?", c: ["required", "force", "mustfill", "important"], a: 0 },
    { id: 198, q: "CSS-də “position” əmrinin yapışdırıcı xüsusiyyətini seçin.", c: ["absolute", "sticky", "fixed", "relative"], a: 1 },
    { id: 1, q: "Obyekt yönümlü proqramlaşdırmanın (OOP) əsas məqsədi nədir?", c: ["Kodun təkrar istifadəsi və modulluğu", "Sintaksis xətalarını tamamilə aradan qaldırmaq", "Yaddaş sahəsinə birbaşa nəzarət etmək", "Proqramın yalnız sətirlərlə işləməsini təmin etmək"], a: 0 },
    { id: 2, q: "Pythonda Class nədir?", c: ["Obyektlərin yaradılması üçün bir şablon (çertyoj)", "Funksiyaları silmək üçün istifadə olunan əmr", "Riyazi hesablamalar aparan modul", "Siyahıları sıralayan daxili metod"], a: 0 },
    { id: 3, q: "Classda dəyişən nümunəsi (instance variable) nədir?", c: ["Sinif nümunəsinə (obyektinə) xas olan dəyişən", "Bütün sinif üçün yalnız bir dəfə yaradılan qlobal sabit", "Funksiyanın daxilindəki müvəqqəti dövr dəyişəni", "Metod adlarının siyahısı"], a: 0 },
    { id: 4, q: "Sinif dəyişəni (class variable) ilə nümunə dəyişəni (instance variable) arasındakı fərq nədir?", c: ["Sinif dəyişənləri bütün nümunələr üçün ümumi, nümunə dəyişənləri isə hər bir nümunə üçün spesifikdir.", "Sinif dəyişənləri yalnız funksiya daxilində, nümunə dəyişənləri isə qlobal mühitdə dəyişdirilə bilər.", "Heç bir fərqi yoxdur, hər ikisi tamamilə eyni funksiyanı yerinə yetirir.", "Nümunə dəyişənləri yalnız rəqəmləri, sinif dəyişənləri isə yalnız sətirləri qəbul edir."], a: 0 },
    { id: 5, q: "OOP-da miras (inheritance) sinifə imkan verir:", c: ["Superklassdan xassələri və davranışları miras almasına", "Mövcud funksiyaları silməyə", "Kodun icra sürətini avtomatik ikiqat artırmağa", "Obyekti str formatına çevirməyə"], a: 0 },
    { id: 6, q: "Obyektyönlü proqramlaşdırmada polimorfizm nədir?", c: ["Sinifdə eyni ada malik bir neçə metodun müəyyən edilməsi və ya müxtəlif obyektlərin eyni metoda fərqli reaksiya verməsi", "Proqramın eyni vaxtda bir neçə fayla yazılması", "Bir sinif daxilində yalnız bir dəyişənin istifadə olunması", "Səhvlərin idarə olunması mexanizmi"], a: 0 },
    { id: 7, q: "Python-da metodun həddindən artıq yüklənməsinə (method overloading) nail olmaq üçün hansı açar sözdən istifadə olunur?", c: ["Python metodların ənənəvi həddindən artıq yüklənməsini yerli olaraq dəstəkləmir", "overload", "dispatch", "override"], a: 0 },
    { id: 8, q: "OOP-də abstraksiyanın əsas məqsədi nədir?", c: ["Mürəkkəb sistemlərin sinifləri modelləşdirməklə sadələşdirilməsi və lazımsız detalların gizlədilməsi", "Bütün gizli dəyişənləri qlobal etmək", "Proqram kodunu sətir-sətir gizlətmək", "Dövr operatorlarının işini dayandırmaq"], a: 0 },
    { id: 9, q: "Mövcud sinfə əsaslanan yeni sinif yaratmaq prosesi üçün termin nədir?", c: ["Miras (Inheritance)", "İnkapulyasiya", "Polimorfizm", "Abstraksiya"], a: 0 },
    { id: 10, q: "OOP-da inkapsulyasiyadan istifadənin faydası nədir?", c: ["Təkmilləşdirilmiş kod təşkili və məlumatın təhlükəsiz qorunması", "Proqramın yaddaşda tutduqu yeri sıfırlamaq", "Bütün dəyişənlərin avtomatik silinməsi", "Kompilyasiya müddətinin qısaldılması"], a: 0 },
    { id: 11, q: "Polimorfizm OOP-da kod çevikliyinə necə kömək edir?", c: ["Müxtəlif növlər (tiplər) üçün vahid interfeys təmin etməklə", "Proqramı exe faylına çevirməklə", "Kod sətirlərinin sayını məhdudlaşdırmaqla", "Bütün obyektləri eyni yaddaş ünvanına yerləşdirməklə"], a: 0 },
    { id: 12, q: "Python-da metaclass nədir?", c: ["Siniflərin özlərini yaratmaq üçün istifadə olunan sinif (sinfin sinfi)", "Siyahıların elementlərini silən xüsusi metod", "Riyazi hesablamaları sürətləndirən kitabxana", "Hər hansı bir dövr operatoru"], a: 0 },
    { id: 13, q: "Python-da @property dekoratorunun məqsədi nədir?", c: ["Bir metodu xüsusiyyət (attribute) kimi çağırmaq və yalnız oxumaq üçün xassələr yaratmaq", "Sinif metodunu silmək üçün", "Kodun icrasını dayandırmaq üçün", "Yeni bir siyahı yaratmaq üçün"], a: 0 },
    { id: 14, q: "Abc modulundan istifadə edərək Python-da necə abstrakt sinif yarada bilərsiniz?", c: ["ABC sinfindən miras almaq və @abstractmethod dekoratoru ilə metodları müəyyən etməklə", "Heç bir şey etmədən, sadəcə pass yazmaqla", "Qlobal dəyişənləri təyin etməklə", "Funksiyanın adını böyük hərflərlə yazmaqla"], a: 0 },
    { id: 15, q: "Python-da __str__ metodunun məqsədi nədir?", c: ["Obyekti istifadəçi üçün anlaşılan simli (string) təsvirə çevirmək üçün", "Obyektin daxili ünvanını silmək üçün", "Obyekti integer tipinə konvertasiya etmək üçün", "İki obyekti bir-birinə vurmaq üçün"], a: 0 },
    { id: 16, q: "Python-da inkapsulyasiyayı necə həyata keçirə bilərsiniz?", c: ["@property dekoratorundan və ya xüsusiyyətlərin önünə alt cizgi (_ və ya __) qoymaqla girişi məhdudlaşdırmaqla", "Yalnız import math yazmaqla", "def açar sözünü silməklə", "Qlobal dəyişənlərdən tamamilə imtina etməklə"], a: 0 },
    { id: 17, q: "Python sinfində __init__ metodunun məqsədi nədir?", c: ["Sinif obyektinin yaradılması zamanı xassələrin (dəyişənlərin) işə salınması (initialization)", "Proqramı tamamilə bağlamaq", "İki sinfi bir-birindən çıxmaq", "Kodun sintaksisini yoxlamaq"], a: 0 },
    { id: 18, q: "İnkapsulyasiya OOP-da məlumatların qorunmasına necə kömək edir?", c: ["Obyektin müəyyən komponentlərinə və daxili vəziyyətinə birbaşa girişi məhdudlaşdırmaqla", "Faylları şifrələməklə", "Proqramı internetdən təcrid etməklə", "Bütün dəyişənlərin sabitə çevirməklə"], a: 0 },
    { id: 19, q: "OOP-da çoxlu miras almanın (multiple inheritance) əsas məqsədi nədir?", c: ["Bir sinfin birdən çox supersinifdən (ana sinifdən) miras almasına icazə vermək", "Bir sinfin eyni vaxtda həm funksiya, həm də dövr olmasına imkan vermək", "Kodun yalnız bir sətirdə yazılmasını təmin etmək", "Bütün alt sinifləri silmək"], a: 0 },
    { id: 20, q: "OOP-də dinamik polimorfizm nədir?", c: ["Kodun icrası (iş vaxtı - runtime) zamanı müxtəlif obyekt tipləri üçün vahid interfeys təmin etmək imkanı", "Proqramın ölçüsünün avtomatik kiçilməsi", "Dəyişənlərin adlarının avtomatik dəyişdirilməsi", "Kompilyasiya zamanı yaranan polimorfizm növü"], a: 0 }
];

let selectedQuestions = [];
let entranceScore = 0;
let timeRemaining = 1800; // 30 dəqiqə = 1800 saniyə
let timerInterval = null;
let examFinished = false;

function initPage() {
    let res = prompt("İmtahana giriş balı (0-50). Boş buraxsan 0 olacaq:", "0");
    entranceScore = parseInt(res);
    if (isNaN(entranceScore) || entranceScore < 0) entranceScore = 0;
    if (entranceScore > 50) entranceScore = 50;
    
    startTimer();
    startQuiz();
}

// REAL GERİYƏ SAYIM FUNKSİYASI (30:00-dan aşağı)
function startTimer() {
    clearInterval(timerInterval);
    timeRemaining = 1800; 
    
    timerInterval = setInterval(() => {
        if (examFinished) {
            clearInterval(timerInterval);
            return;
        }
        
        timeRemaining--;
        
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            document.getElementById("timer").innerText = "Vaxt bitdi!";
            finishExam();
        } else {
            let mins = Math.floor(timeRemaining / 60);
            let secs = timeRemaining % 60;
            document.getElementById("timer").innerText = `Qalan vaxt: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
    }, 1000);
}

function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
}

function startQuiz() {
    examFinished = false;
    document.getElementById("final-score-box").style.display = "none";
    document.getElementById("finish-btn").style.display = "block";
    
    let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
    selectedQuestions = shuffled.slice(0, 25); 
    
    const quizContainer = document.getElementById("quiz");
    quizContainer.innerHTML = "";
    
    selectedQuestions.forEach((item, index) => {
        let correctText = item.c[item.a];
        let options = [...item.c].sort(() => 0.5 - Math.random());
        item.currentAnswers = options; 
        item.correctIndex = options.indexOf(correctText); 
        
        let qHTML = `
            <div class="question-card" id="card-${index}">
                <div class="question-text">
                    ${index + 1}. <span class="q-badge">Sual №${item.id}</span><br><br>${item.q}
                </div>
                <div class="options-container">
        `;
        
        const letters = ["A", "B", "C", "D"];
        options.forEach((opt, optIndex) => {
            qHTML += `
                <label class="option-label" id="lbl-${index}-${optIndex}">
                    <input type="radio" name="q-${index}" value="${optIndex}" onchange="updateLiveStatsOnly()">
                    <b>${letters[optIndex]})</b> &nbsp;${opt}
                </label>
            `;
        });
        
        qHTML += `
                <label class="option-label" id="lbl-${index}-4">
                    <input type="radio" name="q-${index}" value="4" onchange="updateLiveStatsOnly()">
                    <b>E)</b> Boş (cavab yoxdur)
                </label>
            </div>
            <div id="detail-${index}" class="result-detail" style="display:none;"></div>
        </div>`;
        
        quizContainer.innerHTML += qHTML;
    });
    updateLiveStatsOnly();
}

function updateLiveStatsOnly() {
    if (examFinished) return;
    
    let answered = 0;
    let liveDuz = 0;
    let liveSehv = 0;
    let liveBos = 0;

    selectedQuestions.forEach((item, index) => {
        let sel = document.querySelector(`input[name="q-${index}"]:checked`);
        if (sel) {
            let val = parseInt(sel.value);
            if (val !== 4) {
                answered++;
                if (val === item.correctIndex) liveDuz++;
                else liveSehv++;
            } else {
                liveBos++;
            }
        } else {
            liveBos++;
        }
    });
    
    let progressPercent = (answered / 25) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;
    document.getElementById("live-stats").innerHTML = `Cavablanan: ${answered} / 25<br>Düz: ${liveDuz} · Səhv: ${liveSehv} · Boş: ${liveBos}`;
}

function resetAnswers() {
    if (examFinished) return;
    selectedQuestions.forEach((_, index) => {
        let checked = document.querySelector(`input[name="q-${index}"]:checked`);
        if (checked) checked.checked = false;
    });
    updateLiveStatsOnly();
}

function finishExam() {
    examFinished = true;
    clearInterval(timerInterval);
    
    let duz = 0;
    let sehv = 0;
    let bos = 0;
    const letters = ["A", "B", "C", "D", "E"];

    selectedQuestions.forEach((item, index) => {
        let sel = document.querySelector(`input[name="q-${index}"]:checked`);
        let userVal = sel ? parseInt(sel.value) : 4; 
        
        let radios = document.querySelectorAll(`input[name="q-${index}"]`);
        radios.forEach(r => r.disabled = true);

        let card = document.getElementById(`card-${index}`);
        let detail = document.getElementById(`detail-${index}`);
        let correctLetter = letters[item.correctIndex];
        let userLetter = letters[userVal];

        if (userVal === 4) {
            bos++;
            card.classList.add("card-blank");
            detail.innerHTML = `BOŞ &nbsp;&nbsp; Sənin cavabın: - · Düzgün cavab: ${correctLetter}`;
            detail.style.color = "#d4a373";
        } else if (userVal === item.correctIndex) {
            duz++;
            card.classList.add("card-correct");
            document.getElementById(`lbl-${index}-${userVal}`).classList.add("opt-correct");
            detail.innerHTML = `DÜZ &nbsp;&nbsp; Sənin cavabın: ${userLetter} · Düzgün cavab: ${correctLetter}`;
            detail.style.color = "var(--btn-green)";
        } else {
            sehv++;
            card.classList.add("card-incorrect");
            document.getElementById(`lbl-${index}-${userVal}`).classList.add("opt-incorrect");
            document.getElementById(`lbl-${index}-${item.correctIndex}`).classList.add("opt-correct");
            detail.innerHTML = `SƏHV &nbsp;&nbsp; Sənin cavabın: ${userLetter} · Düzgün cavab: ${correctLetter}`;
            detail.style.color = "var(--btn-red)";
        }
        detail.style.display = "block";
    });

    let examScore = (duz * 2) - sehv;
    if (examScore < 0) examScore = 0; 
    let totalScore = examScore + entranceScore;

    document.getElementById("res-duz").innerText = `Düz: ${duz} (x2)`;
    document.getElementById("res-sehv").innerText = `Səhv: ${sehv} (x-1)`;
    document.getElementById("res-bos").innerText = `Boş: ${bos}`;
    
    document.getElementById("sc-sinag").innerText = examScore;
    document.getElementById("sc-giris").innerText = entranceScore;
    document.getElementById("sc-yekun").innerText = totalScore;

    document.getElementById("finish-btn").style.display = "none";
    document.getElementById("final-score-box").style.display = "block";
    
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function restartQuiz() {
    let res = prompt("Yenidən başlamaq üçün giriş balını daxil edin (0-50):", entranceScore);
    if(res !== null) {
        entranceScore = parseInt(res);
        if (isNaN(entranceScore) || entranceScore < 0) entranceScore = 0;
        if (entranceScore > 50) entranceScore = 50;
    }
    startTimer();
    startQuiz();
}

window.onload = initPage;
</script>
