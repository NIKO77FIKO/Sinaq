<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Sınaq Sistemi</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --btn-red: #e74c3c;
            --btn-green: #2ecc71;
            --border-color: #e1e8ed;
            --badge-bg: #e8f4fd;
            --progress-bg: #e1e8ed;
        }
        .dark-mode {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --primary-color: #357abd;
            --border-color: #444444;
            --badge-bg: #3a3a3a;
            --progress-bg: #444444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .quiz-container {
            max-width: 750px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1, h2 { text-align: center; color: var(--text-color); margin: 5px 0; }
        .author { text-align: center; font-weight: bold; margin-bottom: 20px; }
        
        /* Top Control Panel */
        .top-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: stretch;
        }
        .timer-box {
            background-color: var(--btn-red);
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-width: 140px;
        }
        .stats-box {
            background-color: #e2e8f0;
            color: #333;
            padding: 12px 15px;
            border-radius: 6px;
            flex-grow: 1;
            font-size: 13px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .dark-mode .stats-box { background-color: #444; color: white; }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: var(--progress-bg);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--btn-green);
            transition: width 0.3s ease;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-blue { background-color: #4a90e2; }
        .btn-red { background-color: var(--btn-red); }
        .btn-green { background-color: var(--btn-green); }

        /* Questions */
        .question-card {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .card-correct { background-color: rgba(46, 204, 113, 0.15) !important; border-color: var(--btn-green) !important; }
        .card-incorrect { background-color: rgba(231, 76, 60, 0.15) !important; border-color: var(--btn-red) !important; }
        .card-blank { background-color: rgba(241, 196, 15, 0.15) !important; border-color: #f1c40f !important; }

        .question-text { font-size: 15px; font-weight: bold; margin-bottom: 15px; }
        .q-badge { background-color: var(--badge-bg); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        pre { background: #23272e; color: #abb2bf; padding: 12px; border-radius: 6px; overflow-x: auto; font-family: monospace; }
        
        .options-container { display: flex; flex-direction: column; gap: 8px; }
        .option-label {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .option-label:hover { background-color: rgba(74, 144, 226, 0.1); }
        
        .opt-correct { background-color: rgba(46, 204, 113, 0.25) !important; font-weight: bold; border-color: var(--btn-green) !important; }
        .opt-incorrect { background-color: rgba(231, 76, 60, 0.25) !important; font-weight: bold; border-color: var(--btn-red) !important; }

        .result-detail {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 13px;
            font-weight: bold;
        }

        .final-result-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
        }
        .result-grid {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Online Sınaq İmtahanı</h1>
    <div class="author">By Nurali and Nihat</div>

    <div class="top-panel">
        <div id="timer" class="timer-box">Qalan vaxt: 30:00</div>
        <div class="stats-box">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="live-stats">
                Cavablanan: 0 / 25<br>Düz: 0 · Səhv: 0 · Boş: 25
            </div>
        </div>
    </div>

    <button class="btn-action btn-blue" onclick="toggleDarkMode()">🌙 Dark / Light</button>
    <button class="btn-action btn-blue" onclick="restartQuiz()">25 sualı yenidən seç (random)</button>
    <button class="btn-action btn-red" onclick="resetAnswers()">Cavabları sıfırla</button>

    <div id="quiz"></div>

    <button id="finish-btn" class="btn-action btn-green" style="padding:15px; font-size:16px;" onclick="finishExam()">İmtahanı Bitir</button>

    <div id="final-score-box" class="final-result-section" style="display:none;">
        <h2>Nəticə</h2><br>
        <div class="result-grid">
            <span id="res-duz">Düz: 0 (x2)</span>
            <span id="res-sehv">Səhv: 0 (x-1)</span>
            <span id="res-bos">Boş: 25</span>
        </div>
        <div style="font-size:15px; line-height: 1.8;">
            <b>Sınaq balı:</b> <span id="sc-sinag">0</span><br>
            <b>Giriş balı:</b> <span id="sc-giris">0</span><br>
            <hr style="border:0; border-top:1px solid var(--border-color);">
            <b style="font-size:18px; color:var(--primary-color);">Yekun bal: <span id="sc-yekun">0</span></b>
        </div>
        <button class="btn-action btn-green" style="margin-top:20px;" onclick="restartQuiz()">Yenidən başla</button>
    </div>
</div>

<script>
// 100 Suallıq Yenilənmiş Baza Məlumatı
const allQuestions = [
    { id: 1, q: "Obyekt yönümlü proqramlaşdırmanın (OOP) əsas məqsədi nədir?", c: ["Proqramın icra sürətini maksimum dərəcədə artırmaq", "Kodun təkrar istifadəsi və modulluğu", "Bütün dəyişənləri qlobal etmək", "Funksional proqramlaşdırmaya keçid etmək"], a: 1 },
    { id: 2, q: "Pythonda Class nədir?", c: ["Obyektlərin yaradılması", "Standart kitabxana modulu", "Dinamik massiv növü", "Şərt operatoru"], a: 0 },
    { id: 3, q: "Classda dəyişən nümunəsi nədir?", c: ["Qlobal funksiya arqumenti", "Sinif nümunəsinə xas dəyişən", "Statik metod növü", "Dövr operatoru"], a: 1 },
    { id: 4, q: "Sinif dəyişəni ilə nümunə dəyişəni arasındakı fərq nədir?", c: ["Heç bir fərq yoxdur, hər ikisi eyni məqsədlə istifadə olunur.", "Sinif dəyişənləri yalnız metod daxilində, nümunə dəyişənləri isə qlobal sahədə təyin olunur.", "Sinif dəyişənləri bütün nümunələr üçün ümumi, nümunə dəyişənləri isə hər bir nümunə üçün spesifikdir.", "Nümunə dəyişənləri dəyişdirilə bilməz, sinif dəyişənləri isə dəyişdirilə bilər."], a: 2 },
    { id: 5, q: "OOP-da miras sinifə imkan verir:", c: ["Superklassdan xassələri və davranışları miras almasına", "Kodun tamamilə silinməsinə", "Yalnız statik metodların çağırılmasına", "Proqramın interpretasiya edilməməsinə"], a: 0 },
    { id: 6, q: "Obyektyönlü proqramlaşdırmada polimorfizmlər nədir?", c: ["Sinifdə eyni ada malik bir neçə metodun müəyyən edilməsi", "Məlumatların gizlədilməsi prosesi", "Proqramın yaddaşının idarə olunması", "Obyektlərin fayla yazılması"], a: 0 },
    { id: 7, q: "Python-da metodun həddindən artıq yüklənməsinə nail olmaq üçün hansı açar sözdən istifadə olunur?", c: ["overload", "override", "artıq yüklənməsini dəstəkləmir", "extends"], a: 2 },
    { id: 8, q: "OOP-də abstraksiyanın əsas məqsədi nədir?", c: ["Bütün məlumatları istifadəçiyə açıq saxlamaq", "Mürəkkəb sistemlərin sinifləri modelləşdirməklə sadələşdirilməsi", "İnterpretasiya sürətini artırmaq", "Siniflərin sayını məhdudlaşdırmaq"], a: 1 },
    { id: 9, q: "Mövcud sinfə əsaslanan yeni sinif yaratmaq prosesi üçün termin nədir?", c: ["İnkapsulyasiya", "Polimorfizm", "Abstraksiya", "Miras"], a: 3 },
    { id: 10, q: "OOP-da inkapsulyasiyadan istifadənin faydası nədir?", c: ["Təkmilləşdirilmiş kod təşkili", "Yaddaşın tamamilə sıfırlanması", "Kodun daha sürətli işləməsi", "Rekursiyanın qarşısının alınması"], a: 0 },
    { id: 11, q: "Polimorfizm OOP-da kod çevikliyinə necə kömək edir?", c: ["Müxtəlif növlər üçün vahid interfeys təmin etməklə", "Sinifləri bir-birindən tamamilə asılı etməklə", "Kod sətirlərinin sayını artırmaqla", "Yalnız tam ədədlərlə işləməyi məhdudlaşdırmaqla"], a: 0 },
    { id: 12, q: "Python-da metaclass nədir?", c: ["Siniflər yaratmaq üçün sinif", "Standart bir obyekt nümunəsi", "Funksiyanı bəzəyən dekorator", "Siyahı (list) yaradan struktur"], a: 0 },
    { id: 13, q: "Python-da @property dekoratorunun məqsədi nədir?", c: ["Sinfi silmək üçün", "Yeni obyekt yaratmaq üçün", "Yalnız oxumaq üçün xüsusiyyətlər yaratmaq üçün", "Metodun icra sürətini ölçmək üçün"], a: 2 },
    { id: 14, q: "Abc modulundan istifadə edərək Python-da necə abstrakt sinif yarada bilərsiniz?", c: ["@abstractmethod dekoratoru ilə metodları müəyyən etməklə", "Sinfin daxilində \"abstract\" açar sözünü yazmaqla", "Bütün metodları pass ilə boş buraxmaqla", "Yalnız qlobal dəyişənlərdən istifadə etməklə"], a: 0 },
    { id: 15, q: "Python-da __str__ metodunun məqsədi nədir?", c: ["Obyekti simli təsvirə çevirmək üçün", "Obyektləri müqayisə etmək üçün", "Sinfi tamamilə yaddaşdan silmək üçün", "Yeni obyekt kopyalamaq üçün"], a: 0 },
    { id: 16, q: "Python-da inkapsulyasiyanı necə həyata keçirə bilərsiniz?", c: ["Qlobal dəyişənlərdən istifadə etməklə", "@property dekoratorundan istifadə etməklə", "Bütün metodları silməklə", "Sinfi başqa bir sinifdən miras almaqla"], a: 1 },
    { id: 17, q: "Python sinfində __init__ metodunun məqsədi nədir?", c: ["Sinif dəyişənlərinin işə salınması", "Sinif obyektinin məhv edilməsi", "Xarici faylların proqrama daxil edilməsi", "Kodun avtomatik test edilməsi"], a: 0 },
    { id: 18, q: "İnkapsulyasiya OOP-da məlumatların qorunmasına necə kömək edir?", c: ["Obyektin müəyyən komponentlərinə girişi məhdudlaşdırmaqla", "Bütün məlumatları qlobal etməklə", "Kod sətirlərini şifrələməklə", "Proqramın işini dayandırmaqla"], a: 0 },
    { id: 19, q: "OOP-da çoxlu miras almanın əsas məqsədi nədir?", c: ["Bir sinfin birdən çox supersinifdən miras almasına icazə vermək", "Yalnız bir ana siniflə məhdudlaşmaq", "İnterfeyslərin istifadəsini tamamilə qadağan etmək", "Metodların adını dəyişdirmək"], a: 0 },
    { id: 20, q: "OOP-də dinamik polimorfizm nədir?", c: ["Proqramın yalnız kompilyasiya zamanı işləməsi", "İş vaxtında müxtəlif növlər üçün vahid interfeys təmin etmək imkanı", "Bütün dəyişənlərin eyni tipdə olması", "Statik siniflərin yaradılması"], a: 1 },
    { id: 21, q: "İnkapsulyasiya kontekstində Python-da giriş modifikatorlarının məqsədi nədir?", c: ["Yalnız oxumaq üçün xassələri yaratmaq üçün", "Kodun binar fayla çevrilməsi üçün", "Proqrama yeni kitabxanalar qoşmaq üçün", "Rekursiv funksiyalar yazmaq üçün"], a: 0 },
    { id: 22, q: "Python-da __metaclass__ atributunun rolu nədir?", c: ["Bir sinfin metasınıfını göstərmək üçün", "Sinif daxilində dövr yaratmaq üçün", "Səhvləri idarə etmək üçün", "İki sinfi bir-biri ilə toplamaq üçün"], a: 0 },
    { id: 23, q: "Aşağıdakılardan hansı boş (empty) bir sinif təyin edir?", c: ["class MyClass: pass", "class MyClass: void", "class MyClass: null", "class MyClass[]"], a: 0 },
    { id: 24, q: "Aşağıdakılardan hansı Python funksiyasını düzgün müəyyənləşdirir?", c: ["function def_name():", "def function_name():", "create function_name()", "func function_name():"], a: 1 },
    { id: 25, q: "Python funksiyasında return təlimatının məqsədi nədir?", c: ["Funksiyanı tamamlayır və ya dəyəri qaytarır", "Yeni bir dövr başladır", "Funksiyanı silir", "Konsola mətn çap edir"], a: 0 },
    { id: 26, q: "Python-da bir neçə arqument funksiyaya necə ötürülə bilər?", c: ["Arqumentləri fərqli sətirlərdə yazmaqla", "Funksiya çağırıldıqda arqumentləri vergüllə ayırmaq", "Yalnız nöqtəli vergül istifadə etməklə", "Arqumentləri siyahı daxilində ötürməyi tələb etməklə"], a: 1 },
    { id: 27, q: "Python funksiyasında return təlimatları yoxdursa nə baş verir?", c: ["Proqram sintaksis səhvi verir", "Gizli None əməliyyatını qaytarır", "Funksiya sonsuz dövrə girir", "True dəyəri qaytarılır"], a: 1 },
    { id: 28, q: "Python-da iki arqumentlə \"my_function\" adlı funksiyanı çağırmaq üçün aşağıdakı üsullardan hansı məqbuldur?", c: ["my_function(arg1, arg2)", "my_function{arg1, arg2}", "my_function[arg1, arg2]", "my_function:arg1, arg2"], a: 0 },
    { id: 29, q: "Pythonda bir funksiyanı təyin etmək üçün hansı açar söz istifadə olunur?", c: ["function", "fun", "define", "def"], a: 3 },
    { id: 30, q: "Aşağıdakı ifadələrdən hansı Python-dakı funksiya arqumentlərinə aiddir?", c: ["funksiyalar istənilən sayda arqument götürə bilər", "funksiyalar maksimum 2 arqument götürə bilər", "funksiyalar arqument qəbul edə bilməz", "arqumentlər yalnız tam ədəd olmalıdır"], a: 0 },
    { id: 31, q: "Return təlimatının funksiyada məqsədi nədir?", c: ["bir funksiyadan məlumat çıxarmaq üçün istifadə olunur", "proqramı tamamilə bağlamaq üçün", "yeni funksiya elan etmək üçün", "funksiyanın adını dəyişdirmək üçün"], a: 0 },
    { id: 32, q: "Python-da arqumentlər funksiyalara necə ötürülür?", c: ["yalnız qlobal dəyişənlərlə", "mövqeyə görə", "avtomatik olaraq təsadüfi qaydada", "heç bir arqument ötürülə bilməz"], a: 1 },
    { id: 33, q: "Python funksiyalarında yerli dəyişənlər haqqında aşağıdakı ifadələrdən hansı doğrudur?", c: ["bunlar yalnız müəyyən etdikləri funksiya daxilində mövcuddur", "bunlar bütün proqram tərəfindən oxunur", "bunlar funksiya bitdikdən sonra da yaddaşda qalır", "bunlar \"global\" açar sözü ilə yaradılır"], a: 0 },
    { id: 34, q: "Python funksiyalarında pass təlimatının məqsədi nədir?", c: ["Funksiyanı dərhal dayandırmaq üçün", "Heç bir tədbir tələb olunmadıqda yer tutucu kimi istifadə olunur", "Dəyəri geriyə qaytarmaq üçün", "Səhvləri konsolda göstərmək üçün"], a: 1 },
    { id: 35, q: "Python-da arqumentlər olmadan my_function adlı bir funksiyanı çağırmaq üçün aşağıdakı üsullardan hansı düzgündür?", c: ["my_function()", "call my_function", "my_function[]", "my_function{}"], a: 0 },
    { id: 36, q: "Python-da hər hansı bir funksiyadan kənar elan edilmiş qlobal dəyişənin əhatə dairəsi nədir?", c: ["bütün Python proqramında mövcuddur", "yalnız daxili funksiyalarda işləyir", "heç bir yerdə istifadə edilə bilməz", "proqram bitdikdən sonra yaradılır"], a: 0 },
    { id: 37, q: "Python ' dakı bir funksiya, sonrakı dəyəri olmayan qayıtma təlimatını ehtiva edərsə nə olar?", c: ["Səhv mesajı göstərilir", "None gizli funksiyası qaytarır", "Proqram donur", "0 (sıfır) qaytarılır"], a: 1 },
    { id: 38, q: "Python-da bir funksiyanın tamamlanması üçün hansı açar söz istifadə olunur?", c: ["return", "end", "break", "stop"], a: 0 },
    { id: 39, q: "Python funksiya təriflərində * args parametrinin məqsədi nədir?", c: ["Dəyişən sayda arqument funksiyasını tuple şəklində ötürmək üçün istifadə olunur", "Yalnız lüğət (dictionary) qəbul etmək üçün", "Funksiyanı abstrakt etmək üçün", "Arqumentlərin tipini yoxlamaq üçün"], a: 0 },
    { id: 40, q: "Aşağıdakı ifadələrdən hansı Python funksiyalarında rekursiyanı dəqiq təsvir edir?", c: ["Rekursiya, funksiyanın heç vaxt işləmədiyi vəziyyətdir", "Rekursiya, funksiyanın özünü çağırdığı bir üsuldur", "Rekursiya, yalnız sinif daxilində istifadə olunan metoddur", "Rekursiya, i̇ki funksiyanın paralel işləməsidir"], a: 1 },
    { id: 41, q: "Python funksiya təriflərində * * kwargs parametri nə deməkdir?", c: ["açar sözlərlə istənilən sayda arqument götürməsi", "yalnız tam ədədlərdən ibarət siyahı götürməsi", "funksiyanın heç bir arqument qəbul etməməsi", "funksiyanın obyekt qaytarması"], a: 0 },
    { id: 42, q: "Aşağıdakı Python-da Lambda funksiyasını ən yaxşı təsvir edən nədir?", c: ["Lambda funksiyası adı olmayan açar sözündən istifadə etməklə müəyyən edilmiş funksiyadır", "Lambda funksiyası çox sətirli mürəkkəb funksiyadır", "Lambda funksiyası obyektləri silmək üçün istifadə olunur", "Lambda funksiyası yalnız class daxilində işləyir"], a: 0 },

    { id: 198, q: "Dəyişən uzunluqlu arqumentləri olan funksiyanı təyin etmək üçün aşağıdakılardan hansı düzgün sintaksisdir?", c: ["def fun(*vals):\n    for i in vals:\n        print(i,end=\" \")", "def fun(vals*):\n    for i in vals:\n        print(i)", "def fun(**vals):\n    for i in vals:\n        print(i)", "def fun(list vals):\n    for i in vals:\n        print(i)"], a: 0 },
    { id: 199, q: "Aşağıdakı kodun çıxışını tapın?<pre>def fun(x,y=0,z):\n    print(x-y+z)\nfun(1,23)</pre>", c: ["SyntaxError", "-22", "1", "TypeError"], a: 0 }
];

let selectedQuestions = [];
let entranceScore = 0;
let timeRemaining = 1800; // 30 dəqiqə
let timerInterval = null;
let examFinished = false;

function initPage() {
    let res = prompt("İmtahana giriş balı (0-50). Boş buraxsan 0 olacaq:", "0");
    entranceScore = parseInt(res);
    if (isNaN(entranceScore) || entranceScore < 0) entranceScore = 0;
    if (entranceScore > 50) entranceScore = 50;
    
    startTimer();
    startQuiz();
}

function startTimer() {
    clearInterval(timerInterval);
    timeRemaining = 1800; 
    
    timerInterval = setInterval(() => {
        if (examFinished) {
            clearInterval(timerInterval);
            return;
        }
        
        timeRemaining--;
        
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            document.getElementById("timer").innerText = "Vaxt bitdi!";
            finishExam();
        } else {
            let mins = Math.floor(timeRemaining / 60);
            let secs = timeRemaining % 60;
            document.getElementById("timer").innerText = `Qalan vaxt: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
    }, 1000);
}

function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
}

function startQuiz() {
    examFinished = false;
    document.getElementById("final-score-box").style.display = "none";
    document.getElementById("finish-btn").style.display = "block";
    
    let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
    selectedQuestions = shuffled.slice(0, 25); 
    
    const quizContainer = document.getElementById("quiz");
    quizContainer.innerHTML = "";
    
    selectedQuestions.forEach((item, index) => {
        let correctText = item.c[item.a];
        let options = [...item.c].sort(() => 0.5 - Math.random());
        item.currentAnswers = options; 
        item.correctIndex = options.indexOf(correctText); 
        
        let qHTML = `
            <div class="question-card" id="card-${index}">
                <div class="question-text">
                    ${index + 1}. <span class="q-badge">Sual №${item.id}</span><br><br>${item.q}
                </div>
                <div class="options-container">
        `;
        
        const letters = ["A", "B", "C", "D"];
        options.forEach((opt, optIndex) => {
            qHTML += `
                <label class="option-label" id="lbl-${index}-${optIndex}">
                    <input type="radio" name="q-${index}" value="${optIndex}" onchange="updateLiveStatsOnly()">
                    <b>${letters[optIndex]})</b> &nbsp;${opt}
                </label>
            `;
        });
        
        qHTML += `
                <label class="option-label" id="lbl-${index}-4">
                    <input type="radio" name="q-${index}" value="4" onchange="updateLiveStatsOnly()">
                    <b>E)</b> Boş (cavab yoxdur)
                </label>
            </div>
            <div id="detail-${index}" class="result-detail" style="display:none;"></div>
        </div>`;
        
        quizContainer.innerHTML += qHTML;
    });
    updateLiveStatsOnly();
}

function updateLiveStatsOnly() {
    if (examFinished) return;
    
    let answered = 0;
    let liveDuz = 0;
    let liveSehv = 0;
    let liveBos = 0;

    selectedQuestions.forEach((item, index) => {
        let sel = document.querySelector(`input[name="q-${index}"]:checked`);
        if (sel) {
            let val = parseInt(sel.value);
            if (val !== 4) {
                answered++;
                if (val === item.correctIndex) liveDuz++;
                else liveSehv++;
            } else {
                liveBos++;
            }
        } else {
            liveBos++;
        }
    });
    
    let progressPercent = (answered / 25) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;
    document.getElementById("live-stats").innerHTML = `Cavablanan: ${answered} / 25<br>Düz: ${liveDuz} · Səhv: ${liveSehv} · Boş: ${liveBos}`;
}

function resetAnswers() {
    if (examFinished) return;
    selectedQuestions.forEach((_, index) => {
        let checked = document.querySelector(`input[name="q-${index}"]:checked`);
        if (checked) checked.checked = false;
    });
    updateLiveStatsOnly();
}

function finishExam() {
    examFinished = true;
    clearInterval(timerInterval);
    
    let duz = 0;
    let sehv = 0;
    let bos = 0;
    const letters = ["A", "B", "C", "D", "E"];

    selectedQuestions.forEach((item, index) => {
        let sel = document.querySelector(`input[name="q-${index}"]:checked`);
        let userVal = sel ? parseInt(sel.value) : 4; 
        
        let radios = document.querySelectorAll(`input[name="q-${index}"]`);
        radios.forEach(r => r.disabled = true);

        let card = document.getElementById(`card-${index}`);
        let detail = document.getElementById(`detail-${index}`);
        let correctLetter = letters[item.correctIndex];
        let userLetter = letters[userVal];

        if (userVal === 4) {
            bos++;
            card.classList.add("card-blank");
            detail.innerHTML = `BOŞ &nbsp;&nbsp; Sənin cavabın: - · Düzgün cavab: ${correctLetter}`;
            detail.style.color = "#d4a373";
        } else if (userVal === item.correctIndex) {
            duz++;
            card.classList.add("card-correct");
            document.getElementById(`lbl-${index}-${userVal}`).classList.add("opt-correct");
            detail.innerHTML = `DÜZ &nbsp;&nbsp; Sənin cavabın: ${userLetter} · Düzgün cavab: ${correctLetter}`;
            detail.style.color = "var(--btn-green)";
        } else {
            sehv++;
            card.classList.add("card-incorrect");
            document.getElementById(`lbl-${index}-${userVal}`).classList.add("opt-incorrect");
            document.getElementById(`lbl-${index}-${item.correctIndex}`).classList.add("opt-correct");
            detail.innerHTML = `SƏHV &nbsp;&nbsp; Sənin cavabın: ${userLetter} · Düzgün cavab: ${correctLetter}`;
            detail.style.color = "var(--btn-red)";
        }
        detail.style.display = "block";
    });

    let examScore = (duz * 2) - sehv;
    if (examScore < 0) examScore = 0; 
    let totalScore = examScore + entranceScore;

    document.getElementById("res-duz").innerText = `Düz: ${duz} (x2)`;
    document.getElementById("res-sehv").innerText = `Səhv: ${sehv} (x-1)`;
    document.getElementById("res-bos").innerText = `Boş: ${bos}`;
    
    document.getElementById("sc-sinag").innerText = examScore;
    document.getElementById("sc-giris").innerText = entranceScore;
    document.getElementById("sc-yekun").innerText = totalScore;

    document.getElementById("finish-btn").style.display = "none";
    document.getElementById("final-score-box").style.display = "block";

    // Səhifəni avtomatik olaraq nəticələr panelinə (ən aşağıya) rəvan şəkildə sürüşdürür
    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
    });
}

function restartQuiz() {
    let res = prompt("Yenidən başlamaq üçün giriş balını daxil edin (0-50):", entranceScore);
    if(res !== null) {
        entranceScore = parseInt(res);
        if (isNaN(entranceScore) || entranceScore < 0) entranceScore = 0;
        if (entranceScore > 50) entranceScore = 50;
    }
    startTimer();
    startQuiz();
}

window.onload = initPage;
</script>
