<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python & OOP Sınaq İmtahanı (Orijinal Nömrələrlə)</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --background-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #333333;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            max-width: 750px;
            width: 100%;
            background: var(--card-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .question-card {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            background-color: #fafbfc;
        }
        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .q-badge {
            background-color: #e8f4fd;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            margin-left: 5px;
            border: 1px solid #cbd5e1;
        }
        pre {
            background: #23272e;
            color: #abb2bf;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }
        .option-label:hover {
            background-color: #f0f4f8;
            border-color: var(--primary-color);
        }
        input[type="radio"] {
            margin: 0;
            transform: scale(1.2);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #357abd;
        }
        .result-box {
            display: none;
            text-align: center;
            padding: 20px;
            background: #e8f4fd;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: bold;
            border: 2px dashed var(--primary-color);
        }
        .correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724 !important;
            font-weight: 600;
        }
        .incorrect {
            background-color: #f8d7da !important;
            border-color: var(--error-color) !important;
            color: #721c24 !important;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Python & OOP Sınaq</h1>
    <div class="subtitle">Hər dəfə 100 sualdan təsadüfi 25-i seçilir. Sualların orijinal nömrələri qeyd olunub.</div>
    <div id="result" class="result-box"></div>
    <div id="quiz"></div>
    <button id="submit-btn" class="btn" onclick="checkAnswers()">Nəticəni Yoxla (Düz və Səhvlərə Bax)</button>
    <button id="restart-btn" class="btn" style="display:none; background-color: #6c757d;" onclick="startQuiz()">Yenidən Başla (Yeni Suallar)</button>
</div>

let selectedQuestions = [];

function startQuiz() {
    document.getElementById("result").style.display = "none";
    document.getElementById("submit-btn").style.display = "block";
    document.getElementById("restart-btn").style.display = "none";
    
    // Sualları qarışdırıb 25 ədədini seçirik
    let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
    selectedQuestions = shuffled.slice(0, 25); 
    
    const quizContainer = document.getElementById("quiz");
    quizContainer.innerHTML = "";
    
    selectedQuestions.forEach((item, index) => {
        let correctAnswerText = item.c[item.a];
        
        // Variantları qarışdırırıq
        let options = [...item.c].sort(() => 0.5 - Math.random());
        item.currentAnswers = options; 
        item.correctIndex = options.indexOf(correctAnswerText); 
        
        let questionHTML = `
            <div class="question-card" id="q-card-${index}">
                <div class="question-text">
                    ${index + 1}. <span class="q-badge">Sual №${item.id}</span><br><br>${item.q}
                </div>
                <div class="options-container">
        `;
        
        options.forEach((opt, optIndex) => {
            questionHTML += `
                <label class="option-label" id="label-${index}-${optIndex}">
                    <input type="radio" name="question-${index}" value="${optIndex}">
                    ${opt}
                </label>
            `;
        });
        
        questionHTML += `</div></div>`;
        quizContainer.innerHTML += questionHTML;
    });
}

function checkAnswers() {
    let score = 0;
    
    selectedQuestions.forEach((item, index) => {
        const selected = document.querySelector(`input[name="question-${index}"]:checked`);
        
        item.currentAnswers.forEach((_, optIndex) => {
            document.getElementById(`label-${index}-${optIndex}`).classList.remove('correct', 'incorrect');
        });
        
        // Düzgün cavabı yaşıl et
        document.getElementById(`label-${index}-${item.correctIndex}`).classList.add('correct');
        
        if (selected) {
            let answerIndex = parseInt(selected.value);
            if (answerIndex === item.correctIndex) {
                score++;
            } else {
                // Səhv seçiləni qırmızı et
                document.getElementById(`label-${index}-${answerIndex}`).classList.add('incorrect');
            }
        }
    });
    
    const resultBox = document.getElementById("result");
    resultBox.innerHTML = `Sınaq Başa Çatdı!<br>Nəticəniz: 25 sualdan ${score} düzgün cavab.`;
    resultBox.style.display = "block";
    
    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("restart-btn").style.display = "block";
    
    window.scrollTo({top: 0, behavior: 'smooth'});
}

window.onload = startQuiz;
